backend:
  name: github
  # The company GitHub account (created 1 Oct 2026) and the .com website repo (copied from the .in repo on 5 Oct 2026).
  repo: BrothersInteractive/brothers-interactive-com
  branch: main
  # The admin runs on Sveltia CMS (admin/index.html), which reads this Decap-format file.
  # Login = "Sign In with Token": a GitHub personal access token with Contents read/write on
  # the repo above. No OAuth helper is needed, which matters because GitHub Pages can't host one.

# Saving in /admin commits straight to the "main" branch on GitHub; GitHub Pages sees the
# commit and republishes the site automatically, usually within a minute or two.

# On localhost, Sveltia offers "Work with Local Repository" (Chrome/Edge): pick this project
# folder and it edits the real files directly, with no login. local_backend is only read by Decap's
# `npx decap-server` and is harmless otherwise.
local_backend: true

media_folder: "assets/img/portfolio"
public_folder: "/assets/img/portfolio"

collections:
  - name: "home"
    label: "Home"
    description: "The top of the homepage: the headline, the 3D model or picture on the podium, and the client logo strip under it."
    files:
      - name: "hero"
        label: "Headline, subtitle and stats"
        file: "data/hero.json"
        format: "json"
        description: "The very first thing visitors see: headline, subtitle and the three stats."
        fields:
          - { label: "Eyebrow text", name: "eyebrow", widget: "string", hint: "Small line above the headline, e.g. \"3D Game Art Studio · Est. 2019\"." }
          - { label: "Headline — line 1", name: "titleLine1", widget: "string", hint: "e.g. \"We build the\"" }
          - { label: "Headline — accent word", name: "titleAccent", widget: "string", hint: "The big gradient-coloured word, e.g. \"CHARACTERS\"" }
          - { label: "Headline — line 3", name: "titleLine3", widget: "string", hint: "e.g. \"players remember.\"" }
          - { label: "Subtitle paragraph", name: "subtitle", widget: "text" }
          - { label: "Primary button label", name: "primaryBtnLabel", widget: "string", hint: "Links to the Portfolio section." }
          - { label: "Secondary button label", name: "secondaryBtnLabel", widget: "string", hint: "Links to the Contact section. The arrow (→) is added automatically." }
          - { label: "Stat 1 — number", name: "stat1Num", widget: "number", value_type: "int", hint: "The founding year. This one is the only stat number set here -- Stats 2 and 3 always show the real Portfolio and Games counts automatically, below." }
          - { label: "Stat 1 — suffix", name: "stat1Suffix", widget: "string", required: false, hint: "e.g. \"+\". Leave empty for none." }
          - { label: "Stat 1 — label", name: "stat1Label", widget: "string" }
          - { label: "Stat 2 — suffix", name: "stat2Suffix", widget: "string", required: false, hint: "Number is automatic (counts the Portfolio collection)." }
          - { label: "Stat 2 — label", name: "stat2Label", widget: "string" }
          - { label: "Stat 3 — suffix", name: "stat3Suffix", widget: "string", required: false, hint: "Number is automatic (counts the Games collection)." }
          - { label: "Stat 3 — label", name: "stat3Label", widget: "string" }
      - name: "showcase"
        label: "3D model / picture on the podium"
        file: "data/hero-showcase.json"
        format: "json"
        description: "What stands on the podium at the top of the homepage. SEVERAL PICTURES: choose under 'How to show several pictures': side by side (all together), take turns (every 8 seconds) or one at random per visit. Each keeps its own size, animation and position; use Move left/right to space them out. (3D model and video entries always show on their own.) TO SHOW A SPINNING 3D MODEL: (1) In Blender: File > Export > glTF 2.0, Format = glTF Binary (.glb), and under Data > Compression tick Compression. Aim for under 2 MB (textures 2K at most); a bigger file makes the homepage slower. (2) Here: open Showcase > Add Entry (or open an existing entry). (3) 3D model (.glb): click and upload the file. (4) Image: also add a transparent PNG of the same character; it shows while the model loads and on browsers without 3D. (5) Description: a few words, e.g. Stylized orc warrior. (6) 3D model size: leave empty (= 100) first; if the model looks small, try 110 to 120. (7) Save, wait 2 minutes, open the homepage and press Ctrl + F5. TO SHOW A PICTURE ONLY: fill Image and Description, leave 3D model and Video empty. Pictures must be PNGs with the background removed, or they show as a hard rectangle. To stop showing an entry, delete it from the list (keep at least one)."
        fields:
          - label: "How to show several pictures"
            name: "mode"
            widget: "select"
            required: false
            default: "together"
            hint: "Only matters when the list below has 2 or more picture entries."
            options:
              - { label: "Side by side: all pictures on the podium together", value: "together" }
              - { label: "Take turns: one at a time, changing every 8 seconds", value: "turns" }
              - { label: "One at random: a different one on each visit", value: "random" }
          - label: "Showcase"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Entry"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image (transparent PNG)", name: "img", widget: "image", required: false, hint: "Use at least 1600 px wide (2000 px is best), or it looks soft on big screens, especially with Picture size above 100. Shown on its own if the entry has no 3D model or video; otherwise it's the picture shown while those load. Background must be removed/transparent." }
              - { label: "Picture size (%)", name: "imgSize", widget: "number", value_type: "int", min: 50, max: 150, step: 5, required: false, hint: "How big the picture stands on the podium (for a picture without a 3D model). 100 = normal; try 110-130 to make it bigger, 80-90 smaller. It grows upward from the podium. Above 100 the picture file must be big enough (see Image) to stay sharp. Leave empty for 100." }
              - label: "Animation"
                name: "animation"
                widget: "select"
                required: false
                default: "float"
                hint: "How the picture moves on the podium. A 3D model always spins slowly instead."
                options:
                  - { label: "Float: gently up and down (default)", value: "float" }
                  - { label: "Breathe: slowly grows a little and back", value: "breathe" }
                  - { label: "Sway: leans softly left and right", value: "sway" }
                  - { label: "Drift: glides a little left and right", value: "drift" }
                  - { label: "Glow: stays still, the gold glow pulses", value: "glow" }
                  - { label: "None: stands still", value: "none" }
              - { label: "Move left / right (X)", name: "offsetX", widget: "number", value_type: "int", min: -400, max: 400, step: 10, required: false, hint: "In pixels. + moves right, - moves left (e.g. -60). Use it when a character does not sit well on the podium. Leave empty for 0." }
              - { label: "Move up / down (Y)", name: "offsetY", widget: "number", value_type: "int", min: -400, max: 400, step: 10, required: false, hint: "In pixels. + moves up, - moves down (e.g. 30). Phones and tablets use half the value so it stays on screen. Leave empty for 0." }
              - { label: "3D model (.glb)", name: "model", widget: "file", required: false, media_folder: "/assets/models", public_folder: "/assets/models", pattern: ['\.(glb|GLB)$', "This field only takes a .glb 3D model file."], hint: "Optional. A .glb file (Blender: File > Export > glTF 2.0 > glTF Binary, with Compression ticked). Visitors see it spin and can drag to rotate it. Aim for under 2 MB, textures 2K max. Leave empty to show the image only." }
              - { label: "3D model size (%)", name: "modelSize", widget: "number", value_type: "int", min: 50, max: 150, step: 5, required: false, hint: "How big this 3D model appears. 100 = normal (whole model always fits). Higher = bigger, lower = smaller. Above ~120 the top or sides of tall or wide characters may get cut off. Leave empty for 100." }
              - { label: "Video or GIF", name: "video", widget: "file", required: false, media_folder: "/assets/videos", public_folder: "/assets/videos", pattern: ['\.(mp4|webm|gif|MP4|WEBM|GIF)$', "This field only takes an MP4, WebM or GIF. For a 3D model (.glb) use the 3D model field above."], hint: "Optional. Plays silently on a loop in place of the image (a 3D model on the same entry takes priority). For a floating character use a WebM with a transparent background (Safari shows the image instead) or a GIF — a normal MP4 always shows as a rectangle. Keep it short and under ~8 MB." }
              - { label: "Description", name: "alt", widget: "string", hint: "Describes the character for screen readers/SEO, e.g. \"Stylized orc warrior, game-ready\"." }
      - name: "clients"
        label: "Client logos"
        file: "data/clients.json"
        format: "json"
        description: "The client/studio logo wall shown on the homepage."
        fields:
          - label: "Clients"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Client"
            summary: "{{fields.n}}"
            fields:
              - { label: "Name", name: "n", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false, media_folder: "/assets/img/logos", public_folder: "/assets/img/logos", hint: "Optional — only add this once you have permission to use the logo. Leave empty to show the name as text." }

  - name: "games"
    label: "Games"
    description: "The Games section."
    files:
      - name: "text-games"
        label: "Section heading and text"
        file: "data/sections/games.json"
        format: "json"
        description: "The heading and subtitle above the games."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
      - name: "games"
        label: "Games"
        file: "data/games.json"
        format: "json"
        description: "The games shown in the Games section of the homepage — key art, studio, and trailer."
        fields:
          - label: "Games"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Game"
            summary: "{{fields.t}}"
            fields:
              - { label: "Title", name: "t", widget: "string" }
              - { label: "Studio", name: "s", widget: "string", required: false }
              - { label: "YouTube video ID", name: "yt", widget: "string", hint: "Pasting the full video URL also works now — but ideally just the ID, e.g. from https://www.youtube.com/watch?v=JAqvK1peFrA that's JAqvK1peFrA" }
              - { label: "Key Art Image", name: "i", widget: "image", media_folder: "/assets/img/games", public_folder: "/assets/img/games" }

  - name: "testimonials"
    label: "Testimonials"
    description: "The Testimonials section: heading, the number boxes, and the client quotes."
    files:
      - name: "text-testimonials"
        label: "Section heading and text"
        file: "data/sections/testimonials.json"
        format: "json"
        description: "The heading and subtitle above the client quotes."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
      - name: "reviews"
        label: "Client quotes"
        file: "data/testimonials.json"
        format: "json"
        description: "Client testimonials shown on the homepage. Uncheck \"Sample / placeholder\" once you replace a sample with a real, approved quote."
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Review"
            summary: "{{fields.n}} — {{fields.r}}"
            fields:
              - { label: "Quote", name: "q", widget: "text" }
              - { label: "Name", name: "n", widget: "string", hint: "Use \"Client name\" if they'd rather stay anonymous." }
              - { label: "Role / Studio", name: "r", widget: "string" }
              - { label: "Project", name: "project", widget: "string", required: false, hint: "What kind of work this review refers to, e.g. \"Realistic characters\"." }
              - { label: "Photo", name: "img", widget: "image", required: false, media_folder: "/assets/img/team", public_folder: "/assets/img/team" }
              - { label: "Sample / placeholder", name: "sample", widget: "boolean", default: false, hint: "On = shows a \"Sample\" badge. Turn off once this is a real, approved quote." }

  - name: "about"
    label: "About"
    description: "The About section."
    files:
      - name: "about"
        label: "About section"
        file: "data/about.json"
        format: "json"
        description: "The homepage About section: heading, text, the two buttons, the four stat labels and the tools list. The Titles shipped and Published pieces numbers count your Games and Portfolio automatically."
        fields:
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false, hint: "e.g. \"// About\"" }
          - { label: "Heading — start", name: "titleStart", widget: "string", hint: "e.g. \"Quality and\"" }
          - { label: "Heading — coloured word", name: "titleAccent", widget: "string", required: false, hint: "e.g. \"timeline\"" }
          - { label: "Heading — end", name: "titleEnd", widget: "string", required: false, hint: "e.g. \", always.\" (start with a comma or a space)" }
          - { label: "Paragraphs", name: "paragraphs", widget: "list", collapsed: true, label_singular: "Paragraph", field: { label: "Paragraph", name: "paragraph", widget: "text" }, hint: "Each item is one paragraph. Drag to reorder." }
          - { label: "Main button label", name: "primaryBtnLabel", widget: "string", hint: "Opens an email to your business address." }
          - { label: "Second button label", name: "secondaryBtnLabel", widget: "string", hint: "Scrolls to the Team section." }
          - { label: "Founded (year)", name: "foundedYear", widget: "number", value_type: "int", hint: "The year the studio started. Years in production are counted from it." }
          - { label: "Tools heading", name: "toolsTitle", widget: "string" }
          - label: "Tool groups"
            name: "toolGroups"
            widget: "list"
            collapsed: true
            label_singular: "Tool group"
            summary: "{{fields.name}}"
            fields:
              - { label: "Group name", name: "name", widget: "string", hint: "e.g. \"Sculpting\"" }
              - { label: "Tools", name: "tools", widget: "list", hint: "One tool per item, e.g. ZBrush." }
              - label: "Box"
                name: "box"
                widget: "select"
                required: false
                default: "tools"
                hint: "Which box this group appears in on the website."
                options:
                  - { label: "Tools box (software we use)", value: "tools" }
                  - { label: "Second box (how we work with you: communication, pipeline)", value: "workflow" }
          - { label: "Note under the tools", name: "toolsNote", widget: "text", required: false }
          - { label: "Second box heading", name: "workflowTitle", widget: "string", required: false, hint: "Heading of the box for groups set to Second box, e.g. How we work with your team." }

  - name: "portfolio"
    label: "Portfolio"
    description: "The Portfolio section's heading, the categories (the filter buttons) and the Project choices. The pieces themselves are in Portfolio pieces, just below."
    files:
      - name: "text-portfolio"
        label: "Section heading and text"
        file: "data/sections/portfolio.json"
        format: "json"
        description: "The heading and subtitle above the category tiles."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
      - name: "categories"
        label: "Categories (tiles)"
        file: "data/categories.json"
        format: "json"
        description: "The portfolio categories. The order here is the order of the tiles in the homepage Portfolio section; drag to reorder, click Add for a new one. A new category appears on the site and in the Portfolio form's Category list about two minutes after saving (reload /admin to see it there)."
        fields:
          - label: "Categories"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Category"
            summary: "{{fields.label}}"
            fields:
              - { label: "Name", name: "label", widget: "string", hint: "Shown on the tile and on every piece in this category, e.g. Realistic Vehicles." }
              - { label: "Web address name", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and dashes only, e.g. realistic-vehicles"], hint: "Used in the link: brothersinteractive.com/category/<this>/. Lowercase, no spaces. Don't change it once the category is live, or links already shared stop working." }
              - { label: "Tile picture (optional)", name: "tile", widget: "image", required: false, media_folder: "/assets/img/categories", public_folder: "/assets/img/categories", hint: "The picture on the homepage tile (landscape about 4:3 fills best). Empty = the first piece in this category. The tile says Coming soon until the category has a piece." }
              - { label: "Internal code (leave as it is)", name: "key", widget: "string", required: false, hint: "Only the original categories have one; it links them to the pieces already uploaded. Leave empty for a new category." }
      - name: "projects"
        label: "Projects (dropdown choices)"
        file: "data/projects.json"
        format: "json"
        description: "Extra choices for the Project dropdown on each portfolio piece. Every game in the Games section is added to that dropdown automatically, so list here only projects that are not games, e.g. Studio work, Fan art, a client project. New ones appear in the dropdown about two minutes after saving (reload /admin)."
        fields:
          - label: "Projects"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Project"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }

  - name: "pieces"
    label: "Portfolio pieces"
    label_singular: "Piece"
    description: "Every piece in the portfolio, one entry each. Open a piece to set its collage picture, shapes and crops (drag a box on the picture), then Save. Search for a piece by name and open it: the form and the preview then show only that piece. Changes go live about two minutes after saving."
    folder: "data/pieces"
    format: "json"
    extension: "json"
    create: true
    delete: true
    identifier_field: "t"
    slug: "{{slug}}"
    summary: "{{fields.t}}{{fields.hidden | ternary(' · HIDDEN', '')}}"
    sortable_fields: ["order", "t"]
    view_filters:
      - { label: "Hidden pieces", field: "hidden", pattern: true }
      - { label: "Shown on the site", field: "hidden", pattern: false }
    fields:
      - label: "Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
        default: 1000
        hint: "Where this piece sits in lists (smaller comes first). The homepage collage shuffles anyway; this sets the order in a category's filter. Gaps of 10 leave room to slot a piece in between."

      - label: "Hide from the website"
        name: "hidden"
        widget: "boolean"
        default: false
        required: false
        hint: "Tick to keep this piece off the site (grids, viewer, its own page, the sitemap) while it is unfinished. Untick and save to publish it."

      - label: "Leave out of the homepage collage"
        name: "nocollage"
        widget: "boolean"
        default: false
        required: false
        hint: "Tick to keep this piece out of the collage only. It still shows in its category, the viewer and its own page."

      - label: "Collage: can be 2x2 (big square)"
        name: "big"
        widget: "boolean"
        default: false
        required: false
        hint: "The homepage collage picks a few ticked pieces at random on every visit for each shape. Tick the shapes this piece's main picture suits."

      - label: "Collage: can be 2x1 (wide)"
        name: "wide"
        widget: "boolean"
        default: false
        required: false
        hint: "Good for landscape pictures, such as front and back turnarounds."

      - label: "Collage: can be 1x2 (tall)"
        name: "tall"
        widget: "boolean"
        default: false
        required: false
        hint: "Shows the middle of the picture as a tall strip. Good for a single standing figure."

      - label: "Collage picture (optional)"
        name: "thumb"
        widget: "image"
        required: false
        hint: "The picture used for this piece's tile in the homepage collage. Leave empty to use the Main Image. Pick one of this piece's pictures, or upload a new one made for the collage. Then drag the Collage crop box below."

      - label: "Collage crop"
        name: "crop"
        widget: "collagecrop"
        ratio: 1
        required: false
        hint: "Drag a box over the best part of the picture, then Save. That is what the piece's tile shows; wide and tall tiles are made from the same spot automatically. It shows on the website about two minutes after saving. If you change the Collage picture, save first, then crop."

      - label: "Title"
        name: "t"
        widget: "string"
        hint: "The name shown under the artwork, e.g. \"Nitro CR7\""

      - label: "Category"
        name: "c"
        widget: "select"
        hint: "The piece's main category. It decides the label shown on the piece."
        options:
          # @categories (filled in from data/categories.json by tools/build.js)
          - { label: "Modular CHR Skins", value: "modular-chr-skins" }
          - { label: "Realistic CHR", value: "realistic-humans" }
          - { label: "Realistic Creature", value: "realistic-creatures" }
          - { label: "Realistic Hair Card", value: "realistic-hairs" }
          - { label: "Stylized CHR", value: "stylized-human" }
          - { label: "Stylized Creature", value: "stylized-creature" }
          - { label: "Props", value: "props" }
          - { label: "Realistic Weapons", value: "weapons" }
          - { label: "Game - Midnight Walk", value: "mid-night-walk" }
          - { label: "Game - Lost in Random", value: "lost-in-random" }
          # @end

      - label: "Also show in (optional)"
        name: "cats"
        widget: "select"
        multiple: true
        required: false
        hint: "Pick any other categories this same piece should also appear in. No need to upload it again."
        options:
          # @categories (filled in from data/categories.json by tools/build.js)
          - { label: "Modular CHR Skins", value: "modular-chr-skins" }
          - { label: "Realistic CHR", value: "realistic-humans" }
          - { label: "Realistic Creature", value: "realistic-creatures" }
          - { label: "Realistic Hair Card", value: "realistic-hairs" }
          - { label: "Stylized CHR", value: "stylized-human" }
          - { label: "Stylized Creature", value: "stylized-creature" }
          - { label: "Props", value: "props" }
          - { label: "Realistic Weapons", value: "weapons" }
          - { label: "Game - Midnight Walk", value: "mid-night-walk" }
          - { label: "Game - Lost in Random", value: "lost-in-random" }
          # @end

      - label: "Project"
        name: "project"
        widget: "select"
        default: "Studio work"
        hint: "Shown in the Project box on the piece's details page. Pick the game it was made for, or Studio work / Fan art. A new game can be added to this list on request."
        options:
          # @projects (filled in from data/projects.json + the Games list by tools/build.js)
          - "Studio work"
          - "Fan art / studio piece"
          - "Echoes of Aincrad"
          - "Shift At Midnight"
          - "FIFA Heroes"
          - "Tormentor"
          - "The Midnight Walk"
          - "Warhammer 40,000: Space Marine 2"
          - "Ready or Not"
          - "Supermoves"
          - "Warhammer 40,000: Speed Freeks"
          - "Lost in Random"
          - "Dark Envoy"
          - "Wavetale"
          - "The Gunk"
          - "Scavengers"
          # @end

      - label: "Software (optional)"
        name: "software"
        widget: "string"
        required: false
        hint: "e.g. ZBrush, Maya, Substance 3D Painter. Leave empty to hide this box on the website."

      - label: "Poly count (optional)"
        name: "polys"
        widget: "string"
        required: false
        hint: "Numbers and text, e.g. 55K tris (LOD0). Leave empty to hide this box on the website."

      - label: "Textures (optional)"
        name: "textures"
        widget: "string"
        required: false
        hint: "e.g. 3 x 2K + 1 x 1K, PBR metal/rough. Leave empty to hide this box on the website."

      - label: "Extra info boxes (optional)"
        name: "specs"
        widget: "list"
        collapsed: true
        required: false
        label_singular: "Info box"
        summary: "{{fields.label}}: {{fields.value}}"
        hint: "Add your own boxes next to Category / Project, e.g. Heading \"Engine\" and Content \"Unreal Engine 5\". Click Add for another box. A box with nothing typed in is not shown."
        fields:
          - { label: "Heading", name: "label", widget: "string", required: false }
          - { label: "Content", name: "value", widget: "string", required: false }

      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Any short unique code, letters and numbers, no spaces (e.g. AB12cd). Used to link a breakdown or a sculpt-to-final pair to this piece. Must not match any other piece's ID."

      - label: "Main Image"
        name: "i"
        widget: "image"
        hint: "The first picture. JPG or WebP, 1500-2500 px wide; the site shows it at most 1500 x 750 and the lens uses the full file. Grid thumbnails are made automatically."

      - label: "Additional Images"
        name: "imgs"
        widget: "list"
        collapsed: true
        required: false
        label_singular: "Image"
        field: { label: "Image", name: "image", widget: "image" }
        hint: "Other angles or close-ups, in the order they should appear. Same size advice as the Main Image."

      - label: "Description"
        name: "desc"
        widget: "text"
        hint: "Shown on the piece's detail page. A short paragraph is enough."

      - label: "Tags (not shown to visitors)"
        name: "tags"
        widget: "list"
        collapsed: true
        required: false
        hint: "Optional keywords for your own reference, one per line. They are not shown on the website."

      - label: "3D viewer: Sketchfab link (optional)"
        name: "sketchfab"
        widget: "string"
        required: false
        hint: "Paste the Sketchfab link of this model (or just its ID). Visitors can then spin the model on the piece's details page. The model must be public or unlisted, with embedding allowed."

      - label: "3D viewer: Marmoset file (optional)"
        name: "marmoset"
        widget: "file"
        required: false
        media_folder: "/assets/mview"
        public_folder: "/assets/mview"
        pattern: ['\.(mview|MVIEW)$', "Only a Marmoset .mview file."]
        hint: "Export from Marmoset Toolbag (File > Export > Marmoset Viewer) and upload the .mview file here. Visitors can then spin the model on the piece's details page. Keep it small (ideally under 20 MB): it downloads when the page opens."

  - name: "breakdown"
    label: "Breakdown"
    description: "The Breakdown section: its heading and the breakdown pages."
    files:
      - name: "text-breakdown"
        label: "Breakdown: heading and text"
        file: "data/sections/breakdown.json"
        format: "json"
        description: "The heading and subtitle above the breakdown tiles."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
      - name: "breakdowns"
        label: "Breakdown: pages"
        file: "data/breakdowns.json"
        format: "json"
        description: "Production breakdowns. The homepage Breakdown section shows the first 6 as tiles (3 per row); each opens its own page. Every block below is optional — a breakdown page only shows the parts you fill in."
        fields:
          - label: "Breakdowns"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Breakdown"
            summary: "{{fields.t}}"
            fields:
              - { label: "Title", name: "t", widget: "string", hint: "e.g. \"Orc Fanart\" — the page shows it as \"Orc Fanart Breakdown\"." }
              - { label: "ID", name: "id", widget: "string", pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers and dashes only (e.g. orc-fanart)."], hint: "Short unique code used in the page link, e.g. orc-fanart. Lowercase, numbers and dashes only; don't change it once shared." }
              - { label: "Tile image", name: "cover", widget: "image", required: false, hint: "The picture on the homepage tile (landscape ~4:3 fills best). Empty = uses the final image, first gallery image or video thumbnail." }
              - { label: "Short description", name: "sub", widget: "string", required: false, hint: "One line under the title, e.g. \"Stylized creature sculpt, from blockout to game-ready.\"" }
              - { label: "Longer description", name: "desc", widget: "text", required: false, hint: "Optional. Leave a blank line between paragraphs." }
              - { label: "Sketchfab model", name: "sketchfab", widget: "string", required: false, hint: "Optional 3D viewer. Paste the Sketchfab model link (or just its ID). The model must be public or unlisted with embedding allowed." }
              - { label: "Marmoset Viewer file (.mview)", name: "marmoset", widget: "file", required: false, media_folder: "/assets/mview", public_folder: "/assets/mview", pattern: ['\.(mview|MVIEW)$', "Only a Marmoset .mview file."], hint: "Optional 3D viewer. Export from Marmoset Toolbag (File > Export > Marmoset Viewer) and upload the .mview. Keep it small — it downloads when the page opens." }
              - { label: "Sculpt image (before)", name: "before", widget: "image", required: false, hint: "With the Final image, adds the sculpt-to-final drag slider. Same size and framing for both." }
              - { label: "Final image (after)", name: "after", widget: "image", required: false }
              - { label: "YouTube video", name: "youtube", widget: "string", required: false, hint: "Optional. Paste a YouTube link — shown as a video player on the page." }
              - { label: "GIF or video file", name: "video", widget: "file", required: false, media_folder: "/assets/videos", public_folder: "/assets/videos", pattern: ['\.(mp4|webm|gif|MP4|WEBM|GIF)$', "Only an MP4, WebM or GIF file."], hint: "Optional. A GIF or short MP4/WebM turntable that loops silently. Keep it under ~8 MB." }
              - { label: "Gallery images", name: "gallery", widget: "list", collapsed: true, required: false, field: { label: "Image", name: "image", widget: "image" }, hint: "Optional. Extra renders and angles, shown 3 per row." }
              - { label: "Asset page ID", name: "assetId", widget: "string", required: false, hint: "Optional. The Portfolio piece ID (e.g. vbNvDE) to add a \"View full asset page\" button." }
              - label: "Pipeline steps"
                name: "steps"
                widget: "list"
                collapsed: true
                required: false
                label_singular: "Step"
                summary: "{{fields.t}}"
                hint: "Optional. Leave empty to show the standard 6-step pipeline."
                fields:
                  - { label: "Step title", name: "t", widget: "string" }
                  - { label: "Description", name: "d", widget: "string" }

  - name: "services"
    label: "Services"
    description: "The Services section, the FAQ under it, and the \"Let's create your game together\" band."
    files:
      - name: "text-services"
        label: "Services"
        file: "data/sections/services.json"
        format: "json"
        description: "The heading and subtitle, and the service cards. Keep each card to about 4 short tags (2-3 words each) so they sit in two rows."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
          - label: "Services cards"
            name: "services"
            widget: "list"
            collapsed: true
            label_singular: "Service"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Character (person)", value: "character" }
                  - { label: "Hair", value: "hair" }
                  - { label: "Props (box)", value: "props" }
                  - { label: "Engine (screen)", value: "engine" }
                  - { label: "Texture (palette)", value: "texture" }
                  - { label: "Rigging (joints)", value: "rigging" }
              - { label: "Show the blinking 'Specialization' badge", name: "specialization", widget: "boolean", default: false }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Bullet points", name: "points", widget: "list", collapsed: true, required: false, hint: "One point per item." }
      - name: "text-faq"
        label: "FAQ and the band under it"
        file: "data/sections/faq.json"
        format: "json"
        description: "The FAQ heading and text, the questions, and the call-to-action band under them."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Text under the heading", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
          - label: "FAQ"
            name: "faq"
            widget: "list"
            collapsed: true
            label_singular: "Question"
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: "q", widget: "string" }
              - { label: "Answer", name: "a", widget: "text", hint: "A link can be written as [words](/contact)." }
          - label: "Call-to-action band (under the FAQ)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Button label", name: "button", widget: "string", hint: "The button opens the Contact page." }

  - name: "team"
    label: "Team"
    description: "The Team section."
    files:
      - name: "text-team"
        label: "Section heading and text"
        file: "data/sections/team.json"
        format: "json"
        description: "The heading and subtitle above the team."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
      - name: "members"
        label: "Team members"
        file: "data/team.json"
        format: "json"
        description: "The people shown on the Team page."
        fields:
          - label: "Team Members"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Person"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Initials", name: "initials", widget: "string", hint: "Shown if there's no photo, e.g. \"TN\"." }
              - { label: "Photo", name: "photo", widget: "image", required: false, media_folder: "/assets/img/team", public_folder: "/assets/img/team", hint: "Optional — leave empty to show the initials instead." }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Tags", name: "tags", widget: "list", required: false, hint: "Short skill/focus tags, one per line." }
              - label: "Links"
                name: "links"
                widget: "list"
                collapsed: true
                required: false
                label_singular: "Link"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string", hint: "e.g. \"LinkedIn\" or \"Email\"" }
                  - { label: "URL", name: "url", widget: "string", hint: "Include https:// (e.g. https://www.linkedin.com/...). For email use mailto:name@example.com" }

  - name: "careers"
    label: "Careers"
    description: "The Careers section: its text, the Join Us form link, and the images."
    files:
      - name: "text-careers"
        label: "Section text and Join Us link"
        file: "data/sections/careers.json"
        format: "json"
        description: "The heading and paragraph, and the Google Form the blinking Join Us button opens."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Paragraph", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
          - { label: "Google Form link (Join Us button)", name: "formUrl", widget: "string", required: false, hint: "Paste the Google Form share link (starts with https://forms.gle/ or https://docs.google.com/forms/). The blinking Join Us button opens it in a new tab. Leave empty to show Applications opening soon." }
      - name: "images"
        label: "Careers images"
        file: "data/careers-hero.json"
        format: "json"
        description: "The images in the Careers section on the homepage. They show one at a time, each for 10 seconds, with a soft fade. Use PNG or WebP with the background removed (transparent) so they float on the page."
        fields:
          - label: "Images"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Image"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image (transparent PNG/WebP)", name: "img", widget: "image", media_folder: "/assets/img/careers", public_folder: "/assets/img/careers", hint: "Background removed/transparent. Around 1000px wide is plenty." }
              - { label: "Description", name: "alt", widget: "string", hint: "Describes the image for screen readers/SEO, e.g. \"Tiger realistic creature\"." }

  - name: "blog"
    label: "Blog"
    description: "The Blog section at the bottom of the homepage."
    files:
      - name: "text-blog"
        label: "Section heading and text"
        file: "data/sections/blog.json"
        format: "json"
        description: "The heading and subtitle above the posts."
        fields:
          - { label: "Hide this section from the website", name: "hidden", widget: "boolean", required: false, default: false, hint: "Tick while this section has nothing good to show: it disappears from the homepage, the menu and every link to it. Untick and save to bring it back." }
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Production *breakdowns*" }
          - { label: "Subtitle", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/contact)." }
      - name: "posts"
        label: "Blog posts"
        file: "data/posts.json"
        format: "json"
        description: "Video recaps shown in the Blog section of the homepage, rendered as thumbnail cards like Games."
        fields:
          - label: "Posts"
            name: "items"
            widget: "list"
            collapsed: true
            label_singular: "Post"
            summary: "{{fields.t}}"
            fields:
              - { label: "Title", name: "t", widget: "string" }
              - { label: "YouTube video", name: "yt", widget: "string", hint: "Paste the full YouTube URL or just the video ID." }
              - { label: "Thumbnail (optional)", name: "thumb", widget: "image", required: false, media_folder: "/assets/img/blog", public_folder: "/assets/img/blog", hint: "Your own picture for this card, best 16:9 (e.g. 1280x720). Leave empty to use the video's YouTube picture: the site keeps its own small copy either way, so the Blog loads fast." }

  - name: "contact-pages"
    label: "Contact pages"
    description: "The text on the Contact page (/contact) and the Get a quote page (/getting-started)."
    files:
      - name: "text-contact"
        label: "Contact page"
        file: "data/sections/contact.json"
        format: "json"
        description: "The words beside the contact form. The form fields themselves stay as they are."
        fields:
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold, e.g. Let's *talk*" }
          - { label: "Text under the heading", name: "sub", widget: "text", required: false, hint: "A link can be written as [words](/getting-started)." }
          - { label: "Heading above the social links", name: "otherTitle", widget: "string", required: false }
      - name: "text-getting-started"
        label: "Get a quote page"
        file: "data/sections/getting-started.json"
        format: "json"
        description: "The five-step process page, linked from Start a project."
        fields:
          - { label: "Small line above the heading", name: "eyebrow", widget: "string", required: false }
          - { label: "Heading", name: "title", widget: "string", hint: "Put *stars* around the words that should be gold." }
          - { label: "Subtitle", name: "sub", widget: "text", required: false }
          - label: "Steps"
            name: "steps"
            widget: "list"
            collapsed: true
            label_singular: "Step"
            summary: "{{fields.day}} · {{fields.title}}"
            fields:
              - { label: "When (e.g. Day 1-3)", name: "day", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - label: "Engagement models (the small boxes under the steps)"
            name: "models"
            widget: "list"
            collapsed: true
            label_singular: "Box"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Bottom banner heading", name: "ctaTitle", widget: "string", required: false }
          - { label: "Bottom banner text", name: "ctaText", widget: "text", required: false }

  - divider: true

  - name: "settings"
    label: "Settings"
    description: "Contact email, address, social links, header pill."
    files:
      - name: "site"
        label: "Settings"
        file: "data/config.json"
        format: "json"
        description: "Things used on every page: the contact email (where enquiries arrive), the address, the social links in every footer, and the availability pill in the header. Plus the booking link, capabilities PDF, showreel and analytics."
        fields:
          - { label: "Contact email", name: "email", widget: "string", hint: "Where the contact and job-application forms actually deliver to (via formsubmit.co, no signup needed) and the mailto fallback." }
          - { label: "Address", name: "address", widget: "string" }
          - label: "Social links"
            name: "social"
            widget: "list"
            collapsed: true
            required: false
            label_singular: "Social link"
            summary: "{{fields.label}}"
            hint: "The buttons in the footer of every page and on the Contact page. Drag to reorder, Add for a new one (e.g. YouTube, X, Behance), delete to remove one."
            fields:
              - { label: "Name", name: "label", widget: "string", hint: "The button text, e.g. YouTube" }
              - { label: "Link", name: "url", widget: "string", pattern: ['^https?://', "Must start with https://"], hint: "The full address, starting with https://" }
          - { label: "Availability text", name: "availability", widget: "string", required: false, hint: "Shown as the header pill, e.g. \"Taking new projects\". Leave empty to hide it." }
          - { label: "Availability note", name: "availabilityNote", widget: "string", required: false, hint: "Small line under the pill, e.g. \"Next start: on request\"." }
          - { label: "Booking URL", name: "bookingUrl", widget: "string", required: false, hint: "e.g. a Calendly link. Leave empty to hide the booking button." }
          - { label: "Capabilities deck (PDF)", name: "deckPdf", widget: "file", required: false, media_folder: "/assets", public_folder: "/assets" }
          - { label: "Showreel YouTube ID", name: "showreelYouTubeId", widget: "string", required: false, hint: "Leave empty to show an image reel instead." }
          - { label: "Plausible analytics domain", name: "plausibleDomain", widget: "string", required: false, hint: "Leave empty to keep analytics off." }
